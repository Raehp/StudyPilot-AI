server:
  port: 8080

spring:
  application:
    name: studypilot-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:studypilot}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 密码仅从环境变量读取，禁止写入真实值
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.studypilot.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  # 生产环境必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:StudyPilot-AI-Dev-Secret-Key-Change-In-Production-2026}
  expire-hours: 168

# M2 文件存储与上传限制（集中配置，目录可用 STORAGE_DIR 环境变量覆盖）
studypilot:
  storage:
    upload-dir: ${STORAGE_DIR:./data/uploads}
    max-size-mb: 30
  # M3 通义千问接入（封装 RestClient 直连 DashScope OpenAI 兼容端点）
  # Spring AI Alibaba GA 需 Boot 3.4+，与本项目 3.3.5 不兼容，故不引入 Spring AI 依赖
  # API Key 仅从环境变量读取，绝不写入代码/Git/前端/日志
  ai:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    connect-timeout-ms: 10000
    read-timeout-ms: 120000
    max-concurrent: 2
    segment-chars: 6000
    max-segments: 12

logging:
  level:
    com.studypilot: info

# M4 预留：Embedding 使用 DashScope text-embedding-v3（1024 维），届时启用