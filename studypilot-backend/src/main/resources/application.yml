server:
  port: 8080

spring:
  application:
    name: studypilot-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:studypilot}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 密码仅从环境变量读取，禁止写入真实值
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.studypilot.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  # 生产环境必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:StudyPilot-AI-Dev-Secret-Key-Change-In-Production-2026}
  expire-hours: 168

# M2 文件存储与上传限制（集中配置，目录可用 STORAGE_DIR 环境变量覆盖）
studypilot:
  storage:
    upload-dir: ${STORAGE_DIR:./data/uploads}
    max-size-mb: 30
  # M7 接口频率限制（Redis 固定窗口，按 IP+路由桶；仅 POST 写操作限流）
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: 60
    auth-limit: 10
    ai-limit: 30
    upload-limit: 30
  # M3 通义千问接入（封装 RestClient 直连 DashScope OpenAI 兼容端点）
  # Spring AI Alibaba GA 需 Boot 3.4+，与本项目 3.3.5 不兼容，故不引入 Spring AI 依赖
  # API Key 仅从环境变量读取，绝不写入代码/Git/前端/日志
  ai:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    connect-timeout-ms: 10000
    read-timeout-ms: 120000
    max-concurrent: 2
    segment-chars: 6000
    max-segments: 12
  # M4 文本切片参数（集中配置）
  chunk:
    target-chars: 500
    overlap-chars: 80
    min-chunk-chars: 50
    max-chunks-per-doc: 2000
  # M4 DashScope Embedding（text-embedding-v3 / 1024 维 / 版本 v3）
  # Key 仅从环境变量读取，绝不写入代码/Git/前端/日志；仅后端调用
  embedding:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: text-embedding-v3
    dimension: 1024
    version: v3
    batch-size: 10
    connect-timeout-ms: 10000
    read-timeout-ms: 60000
    max-concurrent: 2
  # M6 AI 学习计划（生成复用上方 qwen-plus；可结合知识库真实文档检索）
  plan:
    retrieval-top-k: 6
    retrieval-min-score: 0.45
    max-context-chars: 6000
    max-tasks: 60
    max-generation-ms: 180000
  # M6 AI 智能出题（生成复用上方 qwen-plus；基于知识库真实内容出题与简答判分）
  quiz:
    retrieval-top-k: 8
    retrieval-min-score: 0.45
    max-context-chars: 8000
    min-questions: 1
    max-questions: 20
    default-question-count: 5
    short-answer-pass-score: 60
    max-generation-ms: 180000

logging:
  level:
    com.studypilot: info

  # M5 RAG 多轮问答（检索复用 M4 向量能力；生成复用上方 qwen-plus，流式）
  rag:
    top-k: 5
    min-score: 0.5
    max-question-chars: 2000
    max-history-messages: 10
    max-history-chars: 4000
    max-context-chars: 8000
    sse-timeout-ms: 180000
    max-generation-ms: 180000
    stream-idle-timeout-ms: 60000